[package]
name = "railq"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
crossterm = "0.29"
fs4 = { version = "1", features = ["sync"] }
rand_chacha = "0.10"
ratatui = "0.30"
ron = "0.12"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
unicode-width = "0.2"
uuid = { version = "1.26.1", features = ["serde", "v4"] }
